name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo check --locked --all-features --all-targets
      - run: cargo check --locked --all-features --examples
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo test --locked --all-features --lib --tests --examples
      - run: cargo test --locked --test alice_smoke -- --ignored
      - run: cargo test --locked --doc
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo rustdoc --locked --all-features --lib -- -D warnings
      - run: cargo package --locked
      - run: cargo test --locked --all-features --lib --tests --examples --manifest-path target/package/epub-stack-*/Cargo.toml

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo check --locked --target wasm32-unknown-unknown --all-features
      - run: cargo package --locked
      - run: cargo check --locked --target wasm32-unknown-unknown --all-features --manifest-path target/package/epub-stack-*/Cargo.toml

  msrv:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: "1.93.0"
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.93.0 --profile minimal
      - run: cargo check --locked --all-features --all-targets

  # Consumers resolve their own dependencies from a version requirement, so they can get a
  # semver-compatible release the committed lockfile has never been built against. This job finds
  # that before they do. A failure here is a dependency's doing, not the commit's, so it reports
  # rather than gates.
  floating-deps:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo update
      - run: cargo check --all-features --all-targets
      - run: cargo test --all-features --lib --tests --examples
