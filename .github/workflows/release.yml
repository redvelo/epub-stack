name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - name: Verify release tag
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "epub-stack") | .version')"
          test "$GITHUB_REF_NAME" = "v$version"
      - run: cargo test --locked --all-features --lib --tests --examples
      - run: cargo check --locked --target wasm32-unknown-unknown --all-features
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --locked
      - run: cargo test --locked --all-features --lib --tests --examples --manifest-path target/package/epub-stack-*/Cargo.toml
      - run: cargo check --locked --target wasm32-unknown-unknown --all-features --manifest-path target/package/epub-stack-*/Cargo.toml
      - run: cargo publish --locked --dry-run
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
