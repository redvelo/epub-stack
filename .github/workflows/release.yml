name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Verify release tag
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "epub-stack") | .version')"
          test "$GITHUB_REF_NAME" = "v$version"
      - run: cargo test --all-features --all-targets
      - run: cargo check --target wasm32-unknown-unknown --all-features
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package
      - run: cargo test --all-features --all-targets --manifest-path target/package/epub-stack-*/Cargo.toml
      - run: cargo check --target wasm32-unknown-unknown --all-features --manifest-path target/package/epub-stack-*/Cargo.toml
      - run: cargo publish --dry-run
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
