[package]
description = "Toolkit for the next generation of EPUB applications"
categories = [
  "accessibility",
  "encoding",
  "parser-implementations",
  "text-processing",
  "wasm",
]
documentation = "https://docs.rs/epub-stack/"
exclude = [".github/**", ".gitignore", "fixtures/**"]
keywords = ["epub", "ebook", "ereader", "epub3", "publishing"]
license = "Apache-2.0 OR MIT"
name = "epub-stack"
readme = "README.md"
repository = "https://github.com/redvelo/epub-stack"
rust-version = "1.93"
version = "0.2.0"
edition = "2024"

[features]
serde = ["dep:serde"]
specta = ["dep:specta", "serde"]

[lints.rustdoc]
broken_intra_doc_links = "deny"

[dependencies]
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
percent-encoding = "2.3.2"
sha1 = "0.10.6"
thiserror = "2.0.21"
encoding_rs = "0.8.42"
nom = "8.0.0"
xot = "0.31.2"
quick-xml = { version = "0.42.0", features = ["encoding"] }
lol_html = "3.0.1"
html-escape = "0.2.15"
strum = "0.28.0"
strum_macros = "0.28.0"
bon = "3.10.1"
time = { version = "0.3.55", default-features = false, features = [
  "formatting",
  "parsing",
  "std",
] }
serde_json = "1.0.151"
mime = "0.3.17"
blake3 = "1.8.7"
url = "2.5.8"
oxilangtag = "0.1.6"
cssparser = { version = "0.38.0", default-features = false }
ttf-parser = { version = "0.25.1", default-features = false, features = [
  "std",
  "variable-fonts",
] }
jxl-oxide = { version = "0.12.6", default-features = false }
symphonia = { version = "0.6.1", default-features = false, features = [
  "aac",
  "isomp4",
  "mkv",
  "mp3",
  "ogg",
] }
serde = { version = "1.0.229", features = ["derive"], optional = true }
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }

[dev-dependencies]
rayon = "1.12.0"
specta-serde = "=0.0.12"
specta-typescript = "=0.0.12"

[[bench]]
name = "corpus_analysis"
harness = false
test = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned to 0.3 to supply the wasm backend ahash needs; 0.4 would leave it unbacked.
getrandom = { version = "0.3.4", features = ["wasm_js"] }
